<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Video Firewall – Telemedicine Privacy</title>
    <!-- Load OpenCV.js from CDN -->
    <script async src="https://docs.opencv.org/4.5.5/opencv.js" onload="onOpenCvReady()" type="text/javascript"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; max-width: 1000px; margin: auto; padding: 20px; background: #f5f7fa; }
        h1 { color: #1a3a5c; }
        .row { display: flex; flex-wrap: wrap; gap: 20px; }
        .column { flex: 1; min-width: 300px; }
        video, canvas { width: 100%; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .status { font-size: 1.0em; font-weight: bold; margin: 10px 0; }
        .score { color: #2e7d32; font-weight: bold; margin-left: 8px; }
        button { background: #1a3a5c; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-size: 1em; cursor: pointer; }
        button:hover { background: #0f2a44; }
        input[type="file"] { margin: 10px 0; }
        .note { background: #e3f2fd; padding: 10px; border-radius: 8px; }
    </style>
</head>
<body>
<h1>🔥 Task‑Aware Video Firewall</h1>
<p><strong>Preserves diagnostic motion – obfuscates identity</strong></p>

<input type="file" id="videoInput" accept="video/*">
<button id="processBtn">Process Video</button>
<div class="row">
    <div class="column">
        <h3>Original</h3>
        <video id="origVideo" controls width="100%"></video>
    </div>
    <div class="column">
        <h3>Firewall (Anonymised)</h3>
        <video id="firewallVideo" controls width="100%"></video>
    </div>
</div>
<div class="status">
    <span id="statusText">Upload a video and click Process.</span>
    <span id="scoreText" class="score"></span>
</div>
<div class="note">
    <strong>Score ≥ 0.85</strong> indicates utility (motion) is preserved while identity is hidden.
</div>
<canvas id="canvas" style="display:none;"></canvas>

<script>
let cvReady = false;
let cascade = null;

function onOpenCvReady() {
    cvReady = true;
    console.log('OpenCV.js ready');
}

// Load Haar cascade XML into OpenCV.js FS and create classifier
async function loadFaceCascade() {
    if (!cvReady) throw new Error('OpenCV.js not ready');
    if (cascade) return cascade;
    const localUrl = './haarcascade_frontalface_default.xml';
    const fallbackUrl = 'https://raw.githubusercontent.com/opencv/opencv/master/data/haarcascades/haarcascade_frontalface_default.xml';
    let res;
    try {
        // try local file first (recommended to commit this file into the repo)
        res = await fetch(localUrl);
        if (!res.ok) throw new Error('Local cascade not found');
    } catch (e) {
        // fallback to remote
        console.warn('Local cascade not available, fetching remote:', e);
        res = await fetch(fallbackUrl);
        if (!res.ok) throw new Error('Failed to fetch cascade XML');
    }
    const buf = await res.arrayBuffer();
    const data = new Uint8Array(buf);
    // write to Emscripten FS
    try {
        cv.FS_createDataFile('/', 'haarcascade_frontalface_default.xml', data, true, false, false);
    } catch (e) {
        // might already exist
        console.log('FS_createDataFile:', e.message || e);
    }
    const cls = new cv.CascadeClassifier();
    const loaded = cls.load('haarcascade_frontalface_default.xml');
    if (!loaded) throw new Error('Failed to load Haar cascade into CascadeClassifier');
    cascade = cls;
    return cascade;
}

function computePearson(a, b) {
    if (a.length !== b.length || a.length === 0) return 0;
    const n = a.length;
    let sumA=0, sumB=0;
    for (let i=0;i<n;i++){ sumA+=a[i]; sumB+=b[i]; }
    const meanA = sumA/n; const meanB = sumB/n;
    let num=0, denA=0, denB=0;
    for (let i=0;i<n;i++){
        const da = a[i]-meanA; const db = b[i]-meanB;
        num += da*db; denA += da*da; denB += db*db;
    }
    return num / (Math.sqrt(denA*denB) + 1e-10);
}

document.getElementById('processBtn').addEventListener('click', async () => {
    const input = document.getElementById('videoInput');
    const file = input.files[0];
    const statusText = document.getElementById('statusText');
    const scoreText = document.getElementById('scoreText');
    scoreText.innerText = '';
    if (!file) { alert('Please select a video file.'); return; }
    if (!cvReady) { alert('OpenCV.js is still loading. Please wait.'); return; }

    const origVideo = document.getElementById('origVideo');
    const firewallVideo = document.getElementById('firewallVideo');
    const url = URL.createObjectURL(file);
    origVideo.src = url;
    origVideo.load();

    statusText.innerText = 'Preparing...';

    try {
        await new Promise((resolve) => { origVideo.onloadedmetadata = resolve; });
        const width = origVideo.videoWidth;
        const height = origVideo.videoHeight;
        const canvas = document.getElementById('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');

        // Output canvas for recording
        const outCanvas = document.createElement('canvas');
        outCanvas.width = width; outCanvas.height = height;
        const outCtx = outCanvas.getContext('2d');

        // prepare recorder
        const stream = outCanvas.captureStream(15);
        let mimeType = 'video/webm';
        if (!MediaRecorder.isTypeSupported(mimeType)) mimeType = '';
        const recorder = new MediaRecorder(stream, mimeType ? { mimeType } : undefined);
        const chunks = [];
        recorder.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
        recorder.onstop = () => {
            const blob = new Blob(chunks, { type: 'video/webm' });
            const outUrl = URL.createObjectURL(blob);
            firewallVideo.src = outUrl; firewallVideo.load(); firewallVideo.play();
        };

        // Load cascade once
        await loadFaceCascade();

        // Mats allocation (reused)
        const src = new cv.Mat(height, width, cv.CV_8UC4);
        const rgba = new cv.Mat();
        const grayFull = new cv.Mat();
        const smallGray = new cv.Mat();
        const prevOrig = new cv.Mat();
        const prevProc = new cv.Mat();
        const diff = new cv.Mat();

        const smallW = 160;
        const smallH = Math.max(1, Math.round((smallW * height) / width));

        const origMags = [];
        const procMags = [];
        const maxFrames = 60;
        let processedFrames = 0;

        statusText.innerText = 'Processing frames...';
        recorder.start();

        // Frame processing callback
        const handleFrame = (now, metadata) => {
            if (processedFrames >= maxFrames || origVideo.ended) {
                finalize();
                return;
            }
            // draw current frame to temp canvas
            ctx.drawImage(origVideo, 0, 0, width, height);
            const imageData = ctx.getImageData(0,0,width,height);
            // copy to src mat
            src.data.set(imageData.data);

            // Detect faces on grayscale full
            cv.cvtColor(src, grayFull, cv.COLOR_RGBA2GRAY);
            const faces = new cv.RectVector();
            cascade.detectMultiScale(grayFull, faces, 1.1, 4);

            // Create anonymized frame in a Mat (we will blur region)
            let outMat = new cv.Mat();
            src.copyTo(outMat);

            if (faces.size() > 0) {
                const r = faces.get(0);
                const center = new cv.Point(r.x + r.width/2, r.y + Math.round(r.height*0.4));
                const axes = new cv.Size(Math.round(r.width*0.5), Math.round(r.height*0.35));
                const mask = new cv.Mat.zeros(outMat.rows, outMat.cols, cv.CV_8U);
                cv.ellipse(mask, center, axes, 0, 0, 360, new cv.Scalar(255), -1);
                const blurred = new cv.Mat();
                cv.GaussianBlur(outMat, blurred, new cv.Size(51,51), 0);
                // copy only mask area from blurred into outMat
                blurred.copyTo(outMat, mask);
                mask.delete(); blurred.delete();
            }

            // For motion metric: compute on downsampled grayscale
            cv.cvtColor(src, smallGray, cv.COLOR_RGBA2GRAY);
            cv.resize(smallGray, smallGray, new cv.Size(smallW, smallH));
            if (!prevOrig.empty()) {
                cv.absdiff(smallGray, prevOrig, diff);
                const sum = cv.sumElems(diff)[0];
                origMags.push(sum / (smallW*smallH));
            }
            smallGray.copyTo(prevOrig);

            // For processed frame motion
            cv.cvtColor(outMat, grayFull, cv.COLOR_RGBA2GRAY);
            cv.resize(grayFull, grayFull, new cv.Size(smallW, smallH));
            if (!prevProc.empty()) {
                cv.absdiff(grayFull, prevProc, diff);
                const sum2 = cv.sumElems(diff)[0];
                procMags.push(sum2 / (smallW*smallH));
            }
            grayFull.copyTo(prevProc);

            // draw anonymized frame to outCanvas for recording
            const outImageData = new ImageData(new Uint8ClampedArray(outMat.data), outMat.cols, outMat.rows);
            outCtx.putImageData(outImageData, 0, 0);

            // cleanup per-frame mats
            faces.delete();
            outMat.delete();

            processedFrames++;
            // request next frame
            if ('requestVideoFrameCallback' in origVideo) {
                origVideo.requestVideoFrameCallback(handleFrame);
            } else {
                // fallback: use setTimeout with typical 15fps
                setTimeout(() => handleFrame(), 66);
            }
        };

        function finalize() {
            // stop recorder after a short delay to flush last frames
            setTimeout(() => {
                try { recorder.stop(); } catch (e) { console.warn('recorder stop', e); }
            }, 200);

            // compute final motion score using Pearson on per-frame magnitudes
            let score = 0;
            if (origMags.length > 1 && procMags.length > 1) {
                // align lengths
                const n = Math.min(origMags.length, procMags.length);
                const a = origMags.slice(0,n);
                const b = procMags.slice(0,n);
                score = computePearson(a,b);
            }
            const finalScore = Math.max(0, score);
            statusText.innerText = 'Motion Preservation Score:';
            scoreText.innerText = finalScore.toFixed(3);
            if (finalScore >= 0.85) {
                scoreText.style.color = '#2e7d32'; scoreText.innerText += ' 🏆 (PROMISING)';
            } else if (finalScore >= 0.70) {
                scoreText.style.color = '#ed6c02'; scoreText.innerText += ' (GOOD)';
            } else {
                scoreText.style.color = '#d32f2f'; scoreText.innerText += ' (NEEDS TUNING)';
            }

            // free mats
            try {
                src.delete(); rgba.delete(); grayFull.delete(); smallGray.delete(); prevOrig.delete(); prevProc.delete(); diff.delete();
            } catch (e) { console.warn('mat delete error', e); }
        }

        // Start processing by playing and requesting frames
        await origVideo.play();
        if ('requestVideoFrameCallback' in origVideo) {
            origVideo.requestVideoFrameCallback(handleFrame);
        } else {
            // fallback: setInterval capture while playing
            const fallbackInterval = setInterval(() => {
                if (processedFrames >= maxFrames || origVideo.ended) { clearInterval(fallbackInterval); finalize(); return; }
                ctx.drawImage(origVideo,0,0,width,height);
                handleFrame();
            }, 1000/15);
        }

    } catch (err) {
        console.error(err);
        alert('Error during processing: ' + err.message);
        document.getElementById('statusText').innerText = 'Error: ' + (err.message || err);
    }
});
</script>
</body>
</html>
