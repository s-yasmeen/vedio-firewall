name: TAPF-MIN expanded CREMA-D validation

on:
  workflow_dispatch:
  push:
    branches: [tapf-min-v2-1]
    paths:
      - 'experiments/run_cremad_final_validation.py'
      - '.github/workflows/cremad-final-expanded.yml'

jobs:
  expanded-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scikit-learn opencv-python-headless
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Fetch expanded CREMA-D DFA cohort via Git LFS
        run: |
          git lfs install
          rm -rf /tmp/crema-d
          cd /tmp
          GIT_LFS_SKIP_SMUDGE=1 git clone --depth 1 https://github.com/CheyneyComputerScience/CREMA-D.git crema-d
          cd crema-d
          git lfs pull --include='VideoFlash/*_DFA_*.flv'
          count=$(find VideoFlash -maxdepth 1 -type f -name '*_DFA_*.flv' -size +1000c | wc -l)
          actors=$(find VideoFlash -maxdepth 1 -type f -name '*_DFA_*.flv' -size +1000c -printf '%f\n' | cut -d_ -f1 | sort -u | wc -l)
          echo "Fetched DFA clips: $count across actors: $actors"
          test "$count" -ge 500
          test "$actors" -ge 80
      - name: Run frozen final-validation protocol on expanded cohort
        run: python experiments/run_cremad_final_validation.py /tmp/crema-d/VideoFlash
      - name: Upload expanded final validation metrics
        uses: actions/upload-artifact@v4
        with:
          name: cremad-final-expanded
          path: results/cremad_final_validation.json
