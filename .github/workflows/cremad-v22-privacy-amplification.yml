name: TAPF-MIN v2.2 privacy amplification validation

on:
  workflow_dispatch:
  push:
    branches: [tapf-min-v2-1]
    paths:
      - 'tapf/privacy_gate_v22.py'
      - 'tests/test_privacy_gate_v22.py'
      - 'experiments/run_cremad_v22_privacy_amplification.py'
      - '.github/workflows/cremad-v22-privacy-amplification.yml'

jobs:
  v22-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scikit-learn opencv-python-headless pytest
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Unit-test v2.2 privacy gate
        run: pytest -q tests/test_privacy_gate_v22.py
      - name: Fetch CREMA-D DFA cohort via Git LFS
        run: |
          git lfs install
          rm -rf /tmp/crema-d
          cd /tmp
          GIT_LFS_SKIP_SMUDGE=1 git clone --depth 1 https://github.com/CheyneyComputerScience/CREMA-D.git crema-d
          cd crema-d
          git lfs pull --include='VideoFlash/*_DFA_*.flv'
          count=$(find VideoFlash -maxdepth 1 -type f -name '*_DFA_*.flv' -size +1000c | wc -l)
          actors=$(find VideoFlash -maxdepth 1 -type f -name '*_DFA_*.flv' -size +1000c -printf '%f\n' | cut -d_ -f1 | sort -u | wc -l)
          echo "Fetched DFA clips: $count across actors: $actors"
          test "$count" -ge 500
          test "$actors" -ge 80
      - name: Run prospective v2.2 privacy-amplification benchmark
        run: python experiments/run_cremad_v22_privacy_amplification.py /tmp/crema-d/VideoFlash --folds 5 --seed 42
      - name: Upload v2.2 evidence
        uses: actions/upload-artifact@v4
        with:
          name: cremad-v22-privacy-amplification
          path: results/cremad_v22_privacy_amplification.json
