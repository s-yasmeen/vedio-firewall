name: TAPF-MIN deployment smoke test

on:
  push:
    branches: [tapf-min-research, tapf-min-interface]
    paths:
      - 'service/**'
      - 'tapf/**'
      - 'frontend/**'
      - 'Dockerfile'
      - 'requirements*.txt'
      - 'tests/test_service.py'
      - 'tests/test_frontend.py'
      - 'tests/test_deployment_hardening.py'
      - '.github/workflows/deployment-smoke.yml'
  pull_request:
    branches: [main]

jobs:
  deployment-smoke:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
      TAPF_ATTESTATION_SECRET: ci-only-test-secret
      TAPF_ATTESTATION_KEY_ID: ci-test-key
      TAPF_API_KEY: ci-api-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deployment dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements-deploy.txt
      - name: Run deployment and core tests
        run: pytest -q tests/test_service.py tests/test_frontend.py tests/test_deployment_hardening.py tests/test_controller.py tests/test_transforms.py
      - name: Build deployment image
        run: docker build -t tapf-min:test .
      - name: Start deployment image
        run: |
          docker run -d --name tapf-min-test \
            -e TAPF_ATTESTATION_SECRET=ci-only-test-secret \
            -e TAPF_ATTESTATION_KEY_ID=ci-test-key \
            -e TAPF_API_KEY=ci-api-key \
            -p 8080:8080 tapf-min:test
          sleep 8
      - name: Verify liveness readiness and packaged PWA
        run: |
          python - <<'PY'
          import json, urllib.request
          health=json.load(urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=5))
          ready=json.load(urllib.request.urlopen('http://127.0.0.1:8080/readyz', timeout=5))
          html=urllib.request.urlopen('http://127.0.0.1:8080/app/', timeout=5).read().decode()
          manifest=json.load(urllib.request.urlopen('http://127.0.0.1:8080/app/manifest.webmanifest', timeout=5))
          assert health['status']=='ok' and health['fail_closed'] is True
          assert health['raw_biometric_ingestion'] is False and health['bounded_release_api'] is True
          assert health['ui_available'] is True
          assert health['attestation_signing_configured'] is True and health['api_auth_configured'] is True
          assert ready['ready'] is True
          assert 'Biometric Release Control' in html and 'No raw video upload' in html
          assert manifest['name']=='TAPF-MIN Edge' and manifest['display']=='standalone'
          print('PWA packaged and service ready')
          PY
      - name: Verify bounded authenticated fail-closed release endpoint
        run: |
          python - <<'PY'
          import json, urllib.request
          from datetime import datetime, timezone
          payload={
            'request_id':'ci-request-0001','task':'authentication','representation':'protected-video',
            'measured_at':datetime.now(timezone.utc).isoformat(),
            'operating_points':[{
              'alpha':0.5,'identity_risk':0.1,'identity_risk_upper':0.2,
              'task_utility':0.9,'task_utility_lower':0.8,
              'temporal_risk':0.1,'temporal_risk_upper':0.2,
              'latency_ms':50,'evaluator_id':'ci','sample_count':10
            }]
          }
          req=urllib.request.Request(
            'http://127.0.0.1:8080/v2/release/evaluate',
            data=json.dumps(payload).encode(),
            headers={'Content-Type':'application/json','Authorization':'Bearer ci-api-key'}
          )
          data=json.load(urllib.request.urlopen(req, timeout=5))
          assert data['decision']=='BLOCK'
          assert data['reason']=='representation_not_authorized_for_task'
          assert len(data['evidence_sha256'])==64
          assert data['attestation']['signature']['algorithm']=='HMAC-SHA256'
          print(data['decision'], data['reason'])
          PY
      - name: Container logs on failure
        if: failure()
        run: docker logs tapf-min-test || true
