name: Falling Walls executable demo

on:
  push:
    branches: [tapf-min-v3-2-4-hardening]
    paths:
      - 'demo/**'
      - 'tapf/formal_privacy.py'
      - '.github/workflows/falling-walls-demo.yml'
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install demo dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r demo/requirements-falling-walls.txt
      - name: Compile demo
        run: python -m py_compile demo/falling_walls_demo.py demo/standalone_launcher.py tapf/formal_privacy.py
      - name: Import demo and verify frozen evidence
        run: |
          python - <<'PY'
          import demo.falling_walls_demo as d
          assert d.FROZEN_RESULTS['TAPF-MIN v2.1 frozen validation']['release_decision'] == 'BLOCK'
          assert d._rr_expected_accuracy(1.0, 6) > 0.0
          print('Falling Walls demo smoke test passed')
          PY

  build-windows-exe:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r demo/requirements-falling-walls.txt
          pip install pyinstaller==6.15.0
      - name: Build standalone executable
        shell: pwsh
        run: pyinstaller --noconfirm --clean demo/TAPF_MIN_Falling_Walls.spec
      - name: Verify executable exists
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist/TAPF-MIN-Falling-Walls.exe')) {
            throw 'Standalone executable was not created.'
          }
          Get-Item 'dist/TAPF-MIN-Falling-Walls.exe' | Format-List Name,Length,LastWriteTime
      - name: Launch-test executable
        shell: pwsh
        run: |
          $env:TAPF_DEMO_PORT = '8765'
          $env:TAPF_DEMO_NO_BROWSER = '1'
          $proc = Start-Process -FilePath '.\dist\TAPF-MIN-Falling-Walls.exe' -PassThru
          try {
            $ok = $false
            for ($i = 0; $i -lt 45; $i++) {
              Start-Sleep -Seconds 1
              if ($proc.HasExited) {
                throw "Executable exited before serving the demo. Exit code: $($proc.ExitCode)"
              }
              try {
                $r = Invoke-WebRequest -UseBasicParsing 'http://127.0.0.1:8765' -TimeoutSec 2
                if ($r.StatusCode -eq 200) {
                  $ok = $true
                  break
                }
              } catch { }
            }
            if (-not $ok) {
              throw 'Executable did not serve the Falling Walls interface on localhost.'
            }
            Write-Host 'Standalone executable launch test passed.'
          }
          finally {
            if (-not $proc.HasExited) {
              Stop-Process -Id $proc.Id -Force
            }
          }
      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: TAPF-MIN-Falling-Walls-Windows
          path: |
            dist/TAPF-MIN-Falling-Walls.exe
            demo/README_FALLING_WALLS.md
          if-no-files-found: error
          retention-days: 14
