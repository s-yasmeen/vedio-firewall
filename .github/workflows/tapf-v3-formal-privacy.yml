name: TAPF-MIN v3 formal privacy + FER

on:
  push:
    branches: [tapf-min-v3-formal-privacy]
    paths:
      - 'tapf/formal_privacy.py'
      - 'tapf/fer_v3.py'
      - 'tests/test_formal_privacy.py'
      - 'tests/test_fer_v3.py'
      - 'experiments/run_cremad_v3_deep_fer.py'
      - '.github/workflows/tapf-v3-formal-privacy.yml'
  workflow_dispatch:

jobs:
  formal-privacy-fer-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pytest
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Compile v3 modules
        run: python -m py_compile tapf/formal_privacy.py tapf/fer_v3.py experiments/run_cremad_v3_deep_fer.py
      - name: Run formal privacy tests
        run: pytest -q tests/test_formal_privacy.py
      - name: Run FER architecture tests
        run: pytest -q tests/test_fer_v3.py
