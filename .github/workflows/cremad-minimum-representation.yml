name: CREMA-D minimum-disclosure benchmark

on:
  push:
    branches: [tapf-min-nonimage-privacy]
    paths:
      - 'experiments/run_cremad_minimum_representation.py'
      - 'experiments/run_cremad_privacy_utility_spectrum.py'
      - 'experiments/run_cremad_identity_suppression_sweep.py'
      - 'tapf/minimum_representation.py'
      - 'tests/test_minimum_representation.py'
      - 'tests/test_privacy_utility_spectrum.py'
      - '.github/workflows/cremad-minimum-representation.yml'
  workflow_dispatch:

jobs:
  minimumrep:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scikit-learn opencv-python-headless pytest
      - name: Run edge/unit tests
        run: pytest -q tests/test_minimum_representation.py tests/test_privacy_utility_spectrum.py
      - name: Fetch bounded CREMA-D DFA subset via Git LFS
        run: |
          git lfs install
          rm -rf /tmp/crema-d
          cd /tmp
          GIT_LFS_SKIP_SMUDGE=1 git clone --depth 1 https://github.com/CheyneyComputerScience/CREMA-D.git crema-d
          cd crema-d
          INCLUDE=""
          for id in $(seq 1001 1024); do
            if [ -n "$INCLUDE" ]; then INCLUDE="$INCLUDE,"; fi
            INCLUDE="${INCLUDE}VideoFlash/${id}_DFA_*.flv"
          done
          git lfs pull --include="$INCLUDE"
          count=$(find VideoFlash -maxdepth 1 -type f -name '*_DFA_*.flv' -size +1000c | wc -l)
          echo "Fetched real video clips: $count"
          test "$count" -ge 120
      - name: Run minimum-disclosure benchmark
        run: python experiments/run_cremad_minimum_representation.py /tmp/crema-d/VideoFlash
      - name: Run full privacy-utility spectrum benchmark
        run: python experiments/run_cremad_privacy_utility_spectrum.py /tmp/crema-d/VideoFlash
      - name: Run cross-fitted identity suppression sweep
        run: python experiments/run_cremad_identity_suppression_sweep.py /tmp/crema-d/VideoFlash
      - name: Upload minimum-disclosure metrics
        uses: actions/upload-artifact@v4
        with:
          name: cremad-minimum-representation
          path: |
            results/cremad_minimum_representation.json
            results/cremad_privacy_utility_spectrum.json
            results/cremad_identity_suppression_sweep.json
