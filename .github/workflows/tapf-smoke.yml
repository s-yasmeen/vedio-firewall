name: TAPF-MIN smoke test

on:
  push:
    branches: [main, tapf-min-research]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal test dependencies
        run: pip install pytest
      - name: Run tests
        run: pytest -q
      - name: Run controller simulation
        run: python experiments/run_simulation.py
