name: TAPF-MIN v3 expanded fixed-model privacy audit

on:
  push:
    branches: [tapf-min-v3-formal-privacy]
    paths:
      - 'experiments/run_cremad_v3_fixed_model_audit.py'
      - 'experiments/run_cremad_v3_deep_fer.py'
      - 'tapf/fer_v3.py'
      - '.github/workflows/tapf-v3-fixed-model-expanded.yml'
  workflow_dispatch:

jobs:
  fixed-model-expanded-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scikit-learn opencv-python-headless pytest
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Fetch expanded CREMA-D DFA cohort
        run: |
          git lfs install
          rm -rf /tmp/crema-d
          cd /tmp
          GIT_LFS_SKIP_SMUDGE=1 git clone --depth 1 https://github.com/CheyneyComputerScience/CREMA-D.git crema-d
          cd crema-d
          INCLUDE=""
          for id in $(seq 1001 1091); do
            if [ -n "$INCLUDE" ]; then INCLUDE="$INCLUDE,"; fi
            INCLUDE="${INCLUDE}VideoFlash/${id}_DFA_*.flv"
          done
          git lfs pull --include="$INCLUDE"
          count=$(find VideoFlash -maxdepth 1 -type f -name '*_DFA_*.flv' -size +1000c | wc -l)
          actors=$(find VideoFlash -maxdepth 1 -type f -name '*_DFA_*.flv' -size +1000c -printf '%f\n' | cut -d_ -f1 | sort -u | wc -l)
          echo "Fetched real video clips: $count"
          echo "Fetched actors: $actors"
          test "$count" -ge 500
          test "$actors" -ge 80

      - name: Run one-frozen-model held-out-identity audit
        run: |
          python experiments/run_cremad_v3_fixed_model_audit.py /tmp/crema-d/VideoFlash \
            --epochs 8 \
            --batch-size 8 \
            --frames-per-clip 12 \
            --image-size 112 \
            --seed 42 \
            --audit-fraction 0.33

      - name: Preserve full audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: tapf-v3-fixed-model-expanded-audit
          path: results/cremad_v3_fixed_model_audit.json
          if-no-files-found: error
          retention-days: 30
