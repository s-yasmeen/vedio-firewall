name: ArcFace CREMA-D sequence attack

on:
  push:
    branches: [tapf-min-research]
    paths:
      - 'experiments/run_arcface_cremad.py'
      - 'attackers/insightface_attacker.py'
      - '.github/workflows/arcface-cremad.yml'
      - 'tapf/transforms.py'
  workflow_dispatch:

jobs:
  arcface:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ArcFace benchmark dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install numpy scikit-learn opencv-python-headless onnxruntime insightface
      - name: Fetch bounded CREMA-D subset
        run: |
          git lfs install
          rm -rf /tmp/crema-d
          cd /tmp
          GIT_LFS_SKIP_SMUDGE=1 git clone --depth 1 https://github.com/CheyneyComputerScience/CREMA-D.git crema-d
          cd crema-d
          INCLUDE=""
          for id in $(seq 1001 1008); do
            if [ -n "$INCLUDE" ]; then INCLUDE="$INCLUDE,"; fi
            INCLUDE="${INCLUDE}VideoFlash/${id}_DFA_*.flv"
          done
          git lfs pull --include="$INCLUDE"
          count=$(find VideoFlash -maxdepth 1 -type f -name '*_DFA_*.flv' -size +1000c | wc -l)
          echo "Hydrated clips: $count"
          test "$count" -ge 36
      - name: Run ArcFace sequence attack
        run: python experiments/run_arcface_cremad.py /tmp/crema-d/VideoFlash --max-actors 8
      - name: Upload ArcFace metrics
        uses: actions/upload-artifact@v4
        with:
          name: cremad-arcface-attack
          path: results/cremad_arcface_attack.json
