name: TAPF-MIN dependency security audit

on:
  push:
    branches: [tapf-min-research]
    paths:
      - 'requirements*.txt'
      - 'pyproject.toml'
      - '.github/workflows/security-audit.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install production dependencies and auditor
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-deploy.txt
          pip install pip-audit
      - name: Audit installed production dependency set
        run: pip-audit
