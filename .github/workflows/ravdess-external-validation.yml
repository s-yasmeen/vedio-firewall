name: TAPF-MIN RAVDESS external validation

on:
  workflow_dispatch:
  push:
    branches: [tapf-min-v2-1]
    paths:
      - 'experiments/run_ravdess_external_validation.py'
      - 'tapf/privacy_gate_v22.py'
      - '.github/workflows/ravdess-external-validation.yml'

jobs:
  ravdess-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scikit-learn opencv-python-headless torch
      - name: Download official RAVDESS Facial Landmark Tracking release
        run: |
          python - <<'PY'
          import urllib.request
          url='https://zenodo.org/records/3255102/files/FacialTracking_Actors_01-24.zip?download=1'
          out='/tmp/FacialTracking_Actors_01-24.zip'
          urllib.request.urlretrieve(url,out)
          print(out)
          PY
          test -s /tmp/FacialTracking_Actors_01-24.zip
      - name: Run external v2.2 validation
        run: python experiments/run_ravdess_external_validation.py /tmp/FacialTracking_Actors_01-24.zip --folds 5 --seed 42
      - name: Upload external-validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: ravdess-external-validation-v22
          path: results/ravdess_external_validation_v22.json
